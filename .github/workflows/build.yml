name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Test
      run: go test -v ./...
    
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -o release-checker${{ matrix.goos == 'windows' && '.exe' || '' }} .
        
     - name: Create archive
       id: create_archive
       run: |
         if [[ "${{ matrix.goos }}" == "windows" ]]; then
           zip release-checker-${{ matrix.goos }}-${{ matrix.goarch }}.zip release-checker.exe
           echo "archive=release-checker-${{ matrix.goos }}-${{ matrix.goarch }}.zip" >> $GITHUB_OUTPUT
         else
           tar -czf release-checker-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz release-checker
           echo "archive=release-checker-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" >> $GITHUB_OUTPUT
         fi
          
    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: release-checker-${{ matrix.goos }}-${{ matrix.goarch }}
        path: ${{ steps.create_archive.outputs.archive }}